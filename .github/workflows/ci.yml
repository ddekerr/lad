name: CI

# Запускається на кожен пуш у будь-яку гілку: результат прикріплюється до коміту,
# тож пул-реквест одразу показує його, а `main` захищено від злиття без зеленої перевірки.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Назву завдання (check) вказано в захисті гілки main як обов'язкову перевірку: не перейменовуйте без зміни налаштувань.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Фіктивні значення: збірці й перевіркам реальна база не потрібна
      DATABASE_URL: file:./ci.db
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma client
        run: npx prisma generate

      - name: Міграції відповідають схемі
        run: >
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url file:./shadow.db
          --exit-code

      - name: Lint (ESLint + межі шарів FSD)
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

  # Збірка йде окремо й не входить до обов'язкових перевірок main: вона повільніша й потребує мережі для шрифтів.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./ci.db
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
