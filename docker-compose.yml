# Локальна база для розробки: `npm run db:up`. Значення беруться з .env.development (див. package.json).
# Продакшен використовує окрему віддалену базу через змінні середовища, цей файл його не стосується.
services:
  db:
    image: postgres:16-alpine
    container_name: lad-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lad_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lad}
    ports:
      # Лише з цього комп'ютера: базу з паролем розробки не відкриваємо в мережу
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - lad-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-lad} -d $${POSTGRES_DB:-lad}']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  lad-pgdata:
